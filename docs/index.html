<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>For You 🌷</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital@0;1&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0015;
    overflow: hidden;
    font-family: 'Dancing Script', cursive;
    height: 100vh;
    width: 100vw;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    gap: 20px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,200,255,0.2);
    border-radius: 50px;
    padding: 8px 24px;
  }
  nav a {
    color: #f0c8f8;
    text-decoration: none;
    font-size: 15px;
    font-family: 'Dancing Script', cursive;
    transition: color 0.3s;
  }
  nav a:hover { color: #fff; }
  nav a.active { color: #ff9ee8; font-weight: 700; }

  /* STAR CANVAS */
  #starCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* BUTTERFLY CANVAS */
  #butterflyCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* SCENE */
  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* BOUQUET SVG WRAPPER */
  .bouquet-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }

  /* ENVELOPE */
  .envelope-container {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    animation: floatEnv 3s ease-in-out infinite;
  }

  @keyframes floatEnv {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }

  .envelope-msg {
    background: linear-gradient(135deg, #fff9f0, #fff0fa);
    border: 1px solid #e8b4d4;
    border-radius: 4px;
    padding: 12px 18px;
    max-width: 220px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(200,100,200,0.3), 0 0 40px rgba(255,150,230,0.15);
    position: relative;
  }
  .envelope-msg::before {
    content: '';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 40px solid transparent;
    border-right: 40px solid transparent;
    border-bottom: 14px solid #fff9f0;
    filter: drop-shadow(0 -2px 2px rgba(200,100,200,0.2));
  }
  .envelope-msg::after {
    content: '';
    position: absolute;
    top: -28px;
    left: 0;
    width: 100%;
    height: 28px;
    background: linear-gradient(135deg, #f5d0e8 50%, #f9e0f0 50%);
    border: 1px solid #e8b4d4;
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    clip-path: polygon(0 0, 50% 60%, 100% 0, 100% 100%, 0 100%);
  }
  .envelope-msg p {
    font-family: 'Dancing Script', cursive;
    font-size: 14px;
    color: #7a3060;
    line-height: 1.6;
  }
  .envelope-msg p em { font-style: italic; color: #c06090; }

  /* GLOW */
  .glow-ring {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 60px;
    background: radial-gradient(ellipse, rgba(220,100,200,0.4) 0%, transparent 70%);
    filter: blur(20px);
    animation: pulseGlow 2.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%,100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>

<script>
// ===== STARS (Night sky April 27, 2024) =====
const starCanvas = document.getElementById('starCanvas');
const sCtx = starCanvas.getContext('2d');

starCanvas.width = window.innerWidth;
starCanvas.height = window.innerHeight;

const stars = [];
const NUM_STARS = 280;

// Constellation-like clusters for night sky feel
for (let i = 0; i < NUM_STARS; i++) {
  stars.push({
    x: Math.random() * starCanvas.width,
    y: Math.random() * starCanvas.height * 0.85,
    r: Math.random() * 1.8 + 0.3,
    baseAlpha: Math.random() * 0.6 + 0.4,
    alpha: 0,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
    twinkleOffset: Math.random() * Math.PI * 2,
    color: ['#ffffff','#ffe8ff','#e8e8ff','#fff0e8','#ffeeff'][Math.floor(Math.random()*5)],
    drift: (Math.random()-0.5)*0.08
  });
}

// Shooting stars
const shootingStars = [];

function spawnShootingStar() {
  if (Math.random() < 0.008) {
    shootingStars.push({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height * 0.4,
      vx: (Math.random()*3+2)*( Math.random()<0.5?1:-1),
      vy: Math.random()*2+1,
      life: 1,
      len: Math.random()*80+40
    });
  }
}

let sFrame = 0;
function animateStars() {
  sCtx.clearRect(0,0,starCanvas.width,starCanvas.height);

  // Deep space gradient bg
  const bg = sCtx.createLinearGradient(0,0,0,starCanvas.height);
  bg.addColorStop(0,'#0a0018');
  bg.addColorStop(0.5,'#0d0025');
  bg.addColorStop(1,'#150035');
  sCtx.fillStyle = bg;
  sCtx.fillRect(0,0,starCanvas.width,starCanvas.height);

  // Milky way band
  const mw = sCtx.createLinearGradient(0,starCanvas.height*0.1,starCanvas.width,starCanvas.height*0.5);
  mw.addColorStop(0,'rgba(180,100,220,0.03)');
  mw.addColorStop(0.5,'rgba(220,150,255,0.06)');
  mw.addColorStop(1,'rgba(180,100,220,0.03)');
  sCtx.fillStyle = mw;
  sCtx.beginPath();
  sCtx.ellipse(starCanvas.width*0.5, starCanvas.height*0.35, starCanvas.width*0.6, starCanvas.height*0.25, -0.3, 0, Math.PI*2);
  sCtx.fill();

  sFrame++;
  spawnShootingStar();

  // Draw stars
  for (const s of stars) {
    s.x += s.drift * 0.1;
    if (s.x < 0) s.x = starCanvas.width;
    if (s.x > starCanvas.width) s.x = 0;

    const twinkle = Math.sin(sFrame * s.twinkleSpeed + s.twinkleOffset);
    s.alpha = s.baseAlpha + twinkle * 0.3;

    sCtx.save();
    sCtx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
    sCtx.fillStyle = s.color;
    sCtx.shadowColor = s.color;
    sCtx.shadowBlur = s.r * 4;
    sCtx.beginPath();
    sCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    sCtx.fill();
    sCtx.restore();
  }

  // Shooting stars
  for (let i = shootingStars.length-1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.x += ss.vx*2;
    ss.y += ss.vy*2;
    ss.life -= 0.02;

    if (ss.life <= 0) { shootingStars.splice(i,1); continue; }

    const grad = sCtx.createLinearGradient(ss.x, ss.y, ss.x - ss.vx*ss.len/3, ss.y - ss.vy*ss.len/3);
    grad.addColorStop(0, `rgba(255,220,255,${ss.life})`);
    grad.addColorStop(1, 'rgba(255,220,255,0)');
    sCtx.strokeStyle = grad;
    sCtx.lineWidth = 1.5;
    sCtx.beginPath();
    sCtx.moveTo(ss.x, ss.y);
    sCtx.lineTo(ss.x - ss.vx*ss.len/3, ss.y - ss.vy*ss.len/3);
    sCtx.stroke();
  }

  requestAnimationFrame(animateStars);
}
animateStars();

// ===== BUTTERFLIES =====
const bCanvas = document.getElementById('butterflyCanvas');
const bCtx = bCanvas.getContext('2d');
bCanvas.width = window.innerWidth;
bCanvas.height = window.innerHeight;

class Butterfly {
  constructor() { this.reset(true); }
  reset(init=false) {
    this.x = Math.random() * bCanvas.width;
    this.y = init ? Math.random()*bCanvas.height : bCanvas.height + 50;
    this.vx = (Math.random()-0.5)*1.5;
    this.vy = -(Math.random()*1.5+0.5);
    this.size = Math.random()*18+12;
    this.wingPhase = Math.random()*Math.PI*2;
    this.wingSpeed = Math.random()*0.12+0.06;
    this.color1 = [`#ff88cc`,`#cc66ff`,`#ff99dd`,`#dd88ff`,`#ffaae0`][Math.floor(Math.random()*5)];
    this.color2 = [`#ff55aa`,`#aa33dd`,`#ff66bb`,`#bb44ee`,`#ff77cc`][Math.floor(Math.random()*5)];
    this.alpha = 0.85;
    this.wobbleA = (Math.random()-0.5)*0.5;
    this.wobbleF = Math.random()*0.03+0.01;
    this.age = 0;
  }

  drawWing(ctx, flip) {
    const wf = Math.cos(this.wingPhase) * 0.8 + 0.2;
    const w = this.size * wf * (flip?-1:1);
    const h = this.size * 0.7;

    ctx.save();
    ctx.globalAlpha = this.alpha * 0.9;

    // Upper wing
    const grad1 = ctx.createRadialGradient(w*0.4, -h*0.2, 0, w*0.4, -h*0.2, this.size);
    grad1.addColorStop(0, this.color1+'ee');
    grad1.addColorStop(0.6, this.color1+'aa');
    grad1.addColorStop(1, this.color2+'44');
    ctx.fillStyle = grad1;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(w*0.2,-h*1.1, w*1.1,-h*0.9, w*0.9,-h*0.1);
    ctx.bezierCurveTo(w*0.7,h*0.3, w*0.2,h*0.1, 0,0);
    ctx.fill();
    ctx.strokeStyle = this.color2+'66';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Lower wing
    const grad2 = ctx.createRadialGradient(w*0.3, h*0.4, 0, w*0.3, h*0.4, this.size*0.7);
    grad2.addColorStop(0, this.color2+'cc');
    grad2.addColorStop(1, this.color1+'33');
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(w*0.5,h*0.2, w*0.8,h*0.8, w*0.4,h*0.9);
    ctx.bezierCurveTo(w*0.1,h*1.0, -w*0.1,h*0.6, 0,0);
    ctx.fill();
    ctx.stroke();

    // Wing details
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 0.4;
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(w*0.5,-h*0.6);
    ctx.moveTo(0,0); ctx.lineTo(w*0.7,-h*0.1);
    ctx.moveTo(0,0); ctx.lineTo(w*0.3,h*0.5);
    ctx.stroke();

    ctx.restore();
  }

  update() {
    this.age++;
    this.wingPhase += this.wingSpeed;
    this.x += this.vx + Math.sin(this.age*this.wobbleF)*this.wobbleA;
    this.y += this.vy + Math.cos(this.age*this.wobbleF*0.7)*0.4;
    if (this.y < -60 || this.x < -60 || this.x > bCanvas.width+60) this.reset();
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    // Antennae
    ctx.strokeStyle = this.color1+'99';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-4,-this.size*0.7, -6,-this.size*1.1);
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(4,-this.size*0.7, 6,-this.size*1.1);
    ctx.stroke();
    // Antennae tips
    ctx.fillStyle = this.color2;
    ctx.beginPath(); ctx.arc(-6,-this.size*1.1,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-this.size*1.1,1.5,0,Math.PI*2); ctx.fill();
    // Wings
    this.drawWing(ctx, false);
    this.drawWing(ctx, true);
    // Body
    ctx.fillStyle = '#3a1830';
    ctx.beginPath();
    ctx.ellipse(0,0,2,this.size*0.35,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

const butterflies = Array.from({length:12}, () => new Butterfly());

function animateButterflies() {
  bCtx.clearRect(0,0,bCanvas.width,bCanvas.height);
  for (const b of butterflies) {
    b.update();
    b.draw(bCtx);
  }
  requestAnimationFrame(animateButterflies);
}
animateButterflies();

window.addEventListener('resize', () => {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  bCanvas.width = window.innerWidth;
  bCanvas.height = window.innerHeight;
});
</script>
